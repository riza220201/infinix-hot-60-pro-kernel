# device.conf — everything that makes this build THIS device's build.
# Sourced by build.sh / package.sh / the gate self-tests at preflight.
#
# Every key uses `: "${VAR:=default}"`, so an environment variable set by the
# caller WINS. That is not decoration: the first version of this file used plain
# assignment while claiming env override, so `MODULE_LAYOUT=garbage ./build.sh`
# silently built instead of refusing — a preflight that cannot be triggered is a
# preflight that is not there.
#
# Retargeting to another device is meant to be: edit this file, drop that
# device's boot.img and its shipped modules in place, build. Nothing
# device-specific belongs in the scripts.

# ── Identity ────────────────────────────────────────────────────────────────
: "${DEVICE_LABEL:=Infinix HOT 60 Pro+}"
: "${DEVICE_SOC:=MediaTek MT6789}"       # read out of vendor_boot's DTB + the module names
: "${BRAND:=RivalAbadi}"                 # CONFIG_LOCALVERSION becomes -$BRAND-<variant>
: "${BRAND_FULL:=Rival Abadi Kernel}"     # the human-readable name, for banners
# ⚠ BRAND goes into CONFIG_LOCALVERSION and therefore into `uname -r`, so it
#   must have NO spaces — the kernel version string is parsed by things that do
#   not expect them. BRAND_FULL carries the readable form for installer banners.
#
# The release string is <VERSION>-$BRAND-<variant>, e.g. 6.12.38-RivalAbadi-vanilla —
# the same shape as the itel RS4's 5.10.260-Riza-vanilla. kleaf's own tokens
# (-android16-5, -g<sha>[-dirty], -4k) are stripped by build.sh; see brand_source().
# The /proc/version builder, "(user@host)", replaces kleaf's hardcoded kleaf@build-host.
: "${KBUILD_BUILD_USER:=riza}"
: "${KBUILD_BUILD_HOST:=${BRAND}Kernel}"

# AnyKernel3 device.name1..N. ⚠ NOT YET KNOWN: every image supplied is the
# Transsion generic vendor (ro.product.vendor.device=tssi), which carries no
# per-model codename — those props live on product/odm, which we do not have.
# The packaged zip sets do.devicecheck=0, so this list is cosmetic until someone
# reads `getprop ro.product.device` on the phone. Write it down then, rather
# than leaving a guess here.
: "${DEVICE_NAMES:=}"

# Which kernel artefact gets repacked into boot.img. Read off the stock image:
#   magiskboot unpack boot.img  ->  KERNEL_FMT [lz4_legacy]
: "${KERNEL_FMT:=lz4}"

# ── The KMI target — the make-or-break number ───────────────────────────────
# Obtain it for a new device with:
#   modprobe --dump-modversions <vendor>.ko | awk '$2=="module_layout"{print $1}'
# Here: agreed by all 424 shipped modules (189 vendor_dlkm + 235 vendor_boot).
: "${MODULE_LAYOUT:=0xe976b219}"

# The reference set every build is cross-checked against: a TREE, one
# subdirectory per shipped module set, because this device ships two and both
# must load. A flat directory would hide which set a stray came from.
: "${KMI_REF_TREE:=$PROJ/.build/kmi-ref}"

# Provenance of that reference set. Asserted, not assumed — a stale reference
# set cannot fail, and on the sibling RS4 project one silently went stale for a
# day with no symptom. Exported so the python gates see it.
: "${KMI_EXPECT_VERMAGIC:=6.12.38-android16-5-gcc51d883045d-4k}"
export KMI_EXPECT_VERMAGIC

# Modules we compile ourselves and therefore expect to carry a different
# vermagic. Every entry is a hole in the provenance layer, so each one needs a
# reason written next to it — nothing else will ask.
: "${KMI_VERMAGIC_EXCEPTIONS:=}"        # (none today)
export KMI_VERMAGIC_EXCEPTIONS

# Symbols the stock module set imports that NOTHING provides — pre-existing OEM
# defects, not regressions. This device currently has ZERO (unlike the itel RS4,
# where three dw9781caf_* symbols were wanted by a module whose provider was
# never shipped), so an unresolved symbol after our build has no excuse
# available: it would be ours.
: "${KMI_UNRESOLVED_EXPECTED:=}"
export KMI_UNRESOLVED_EXPECTED

# ── system_dlkm: Google's own GKI modules, which the ROM loads too ──────────
# 81 modules (modules.load lists all of them), built with the stock kernel at
# gb575a0b6e647-ab14355190 and signed with ITS build key — which no kernel we build
# holds, so to our kernel every one of them is unsigned. Gated as a third module
# set (tools/extract-device-material.sh regenerates it from the image).
: "${STOCK_SYSTEM_DLKM_IMG:=$PROJ/system_dlkm_b.img}"
: "${KMI_REF_SYSTEM_TREE:=$PROJ/.build/kmi-ref-system}"
: "${KMI_SYSTEM_EXPECT_VERMAGIC:=6.12.38-android16-5-gb575a0b6e647-ab14355190-4k}"
# Known-bad: failures here are reported but do not fail the gate. Each needs a reason.
#   rust_binder.ko — 22 CRC mismatches (Rust-crate symbols are not KMI-stable across
#                    kernel commits), 2 unresolved, 130 non-permitted imports. Unused:
#                    Android runs the built-in C binder (the phone boots on ours).
#   9pnet_fd.ko    — 3 non-permitted imports. 9p over fds is for virtual machines.
: "${KMI_SYSTEM_KNOWN_BAD:=rust_binder.ko 9pnet_fd.ko}"

# ── Stock inputs ────────────────────────────────────────────────────────────
: "${STOCK_BOOT_IMG:=$PROJ/boot.img}"
: "${STOCK_CONFIG:=$PROJ/.build/ikconfig/stock.config}"
