# sources.lock — the single source of truth for every out-of-tree commit this
# project builds from. A branch name is not a pin: branches move, and a build
# that cannot be re-run is not a build you can stand behind.
#
# Sourced by build.sh and the apply-* scripts. Env overrides anything here.

# ── Kernel source: Google ACK via the official kleaf manifest ───────────────
KERNEL_MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
KERNEL_MANIFEST_BRANCH="common-android16-6.12-lts"   # toolchain/kleaf only; `common` is pinned below
KERNEL_MANIFEST_REF="cd0692ac8a092d3fc2f6b58fab6b3d5d9a2f8cd8"
# ✏️ CHANGED 2026-09-30 after the gate measured it.
# Was android16-6.12-lts @ 57041e4a (6.12.93, KMI_GENERATION=6). That build was
# KMI-BROKEN against this device: 9,907 of 24,071 symbol CRCs mismatched and
# module_layout failed on all 424 modules. Every load-bearing config option was
# IDENTICAL (CFI_CLANG, LTO_NONE, MODVERSIONS, TRIM_UNUSED_KSYMS,
# SHADOW_CALL_STACK, ARM64_MTE, KASAN_HW_TAGS, UBSAN, DEBUG_INFO_BTF), so the
# difference is the KMI GENERATION, not the configuration.
# 🔑 GKI's ABI promise holds WITHIN a generation. A generation bump is Google
#    explicitly allowing a break, and this device is on generation 5.
KERNEL_COMMON_REF="1ad7be92b3ed2e7d9c39f9b6d96bb91f1220c76d"
KERNEL_COMMON_VERSION="6.12.38"   # android16-6.12-2025-09, KMI_GENERATION=5
KLEAF_BUILD_REF="fb7c474390f227c63b657ef2d8b395cf860b04ea"            # kernel/build (kleaf)

# ⚠ The device ships android16-**5** (KMI generation 5 = branch
# android16-6.12-2025-09, SUBLEVEL 38). This branch declares KMI_GENERATION=6.
# Carried deliberately per the operator's patch-level rule; the 4,927-CRC gate
# is what settles it. Fallback if it ever comes back dirty:
KERNEL_COMMON_BRANCH="android16-6.12-2025-09"   # the device's own KMI line
KERNEL_PREVIOUS_ATTEMPT="android16-6.12-lts @ 57041e4a — gate FAILED, see above"

# ── Toolchain (from common/build.config.constants — do not set by hand) ─────
CLANG_VERSION="r536225"
RUSTC_VERSION="1.82.0.p2"

# ── Root variant (ksunext) — NOT YET PINNED ────────────────────────────────
# Nothing is chosen until the pairing is verified against android16-6.12.
# Do not copy the itel RS4's 5.10-era pins here; none of them apply.
KSU_REF=""
KSU_VER_EXPECT=""
SUSFS_REF=""
