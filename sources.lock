# sources.lock — the single source of truth for every out-of-tree commit this
# project builds from. A branch name is not a pin: branches move, and a build
# that cannot be re-run is not a build you can stand behind.
#
# Sourced by build.sh and the apply-* scripts. Env overrides anything here.

# ── Kernel source: Google ACK via the official kleaf manifest ───────────────
KERNEL_MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
KERNEL_MANIFEST_BRANCH="common-android16-6.12-lts"   # toolchain/kleaf only; `common` is pinned below
KERNEL_MANIFEST_REF="cd0692ac8a092d3fc2f6b58fab6b3d5d9a2f8cd8"
# ✏️ CHANGED 2026-09-30 after the gate measured it.
# Was android16-6.12-lts @ 57041e4a (6.12.93, KMI_GENERATION=6). That build was
# KMI-BROKEN against this device: 9,907 of 24,071 symbol CRCs mismatched and
# module_layout failed on all 424 modules. Every load-bearing config option was
# IDENTICAL (CFI_CLANG, LTO_NONE, MODVERSIONS, TRIM_UNUSED_KSYMS,
# SHADOW_CALL_STACK, ARM64_MTE, KASAN_HW_TAGS, UBSAN, DEBUG_INFO_BTF), so the
# difference is the KMI GENERATION, not the configuration.
# 🔑 GKI's ABI promise holds WITHIN a generation. A generation bump is Google
#    explicitly allowing a break, and this device is on generation 5.
KERNEL_COMMON_REF="1ad7be92b3ed2e7d9c39f9b6d96bb91f1220c76d"
KERNEL_COMMON_VERSION="6.12.38"   # android16-6.12-2025-09, KMI_GENERATION=5
KLEAF_BUILD_REF="fb7c474390f227c63b657ef2d8b395cf860b04ea"            # kernel/build (kleaf)

# The device ships android16-**5** (KMI generation 5); the pin above is on that
# generation's own branch, which the 4,927-CRC gate confirmed (0 mismatches).
KERNEL_COMMON_BRANCH="android16-6.12-2025-09"   # the device's own KMI line
KERNEL_PREVIOUS_ATTEMPT="android16-6.12-lts @ 57041e4a — gate FAILED, see above"

# ── Toolchain (Neutron clang 24, overriding common/build.config.constants) ──
CLANG_VERSION="neutron-clang-06092026 (clang 24.0.0git, llvm f42c87ba)"
CLANG_PREBUILT_REF="r536225"
RUSTC_VERSION="1.82.0.p2"

# ── ksunext variant: KernelSU-Next v3.4.2 "Wild" (pershoot dev-susfs) + SusFS v2.3.0 ──
# Method ported from itel-rs4-kernel (which mirrors WildKernels/GKI_KernelSU_SUSFS):
# SusFS is IN-DRIVER on pershoot's dev-susfs, so there is NO 10_enable_susfs_for_ksu
# patch. That patch is for stock KernelSU; measured against this tree it fails 20 hunks
# on KSU-Next v3.4.0 and 36 on v3.3.0 — the pairing, not the patch, was the problem.
#
# 86cf3441 = upstream KernelSU-Next dev cefb048b (v3.4.2 + 97, 10-31) + 14 Wild commits
# (incl. "susfs (v2.3.0): Introduce SuSFS" 10-31, "selinux_hide: Even out attr/current
# timing" 10-29, and the 4 Samsung KDP/RKP/DEFEX compat commits, inert on mediatek,MT6789).
# pershoot REBASED dev-susfs again: v3's d21e0a66 is on no branch; kept as local branch
# hot60pro-pin-20261031, this pin as hot60pro-pin-20261101 (a pin into a rebasing fork rots).
WILDKSU_REF="86cf3441815fe71dbc35ff6c675c3eea3f946467"      # pershoot/KernelSU-Next dev-susfs (hot60pro-pin-20261101)
WILDKSU_VERBASE="cefb048b069b7439fb4020d043de2d338dbc00fa"                                    # version anchor = merge-base with upstream dev (v3.4.2-97-gcefb048b)
WILDKSU_VER_EXPECT="33452"                                   # 30000 + rev-count(VERBASE); apply script DIES on drift
# 🔑 UAPI 6 (unchanged since v3): no KernelSU-Next release carries it (newest is still v3.4.2,
#    uapi 5). Pair with the KernelSU-Next CI manager of cefb048b: Actions run 41209311538
#    ("Build Manager CI", success, artifacts `manager` / `manager-spoofed`, expire 2027-01-29).
# SusFS kernel side bumped to f0939fc (2026-11-01): pershoot's 86cf3441 ("kernel: selinux_hide:
#    Even out attr/current timing") calls susfs_add_sus_type / susfs_add_sus_avd_allowed_by_type
#    introduced in simonpunk's 15890c6 + a8af3db + f0939fc.
SUSFS_REF="f95c7639616f37166cce09ae59ef5cdb091e325f"        # simonpunk gki-android16-6.12 f0939fc + 2 pershoot picks, rebased onto 1ad7be92b (hot60pro-susfs-20261101)

# ── Source modifications — VENDORED in patches/ ───────────────────────────────
# The ported patches themselves are the pin: each is generated against
# KERNEL_COMMON_REF and applied with strict `git apply` (patches/series). These
# refs record where each port came FROM, so a re-port starts from the same place.
BORE_UPSTREAM="firelzrd/bore-scheduler@1e2f57a patches/stable/0001-linux6.12.37-bore-7.0.0.patch"  # re-checked 2026-11-01: still upstream HEAD
NTSYNC_UPSTREAM="torvalds/linux v6.14 drivers/misc/ntsync.c + fixes 61611481f7b5, 180a232ea780"  # re-checked 2026-11-01: only 64cbb36448ff since (FD_PREPARE API, absent in 6.12)
REFLEX_UPSTREAM="firelzrd/reflex@f0a6678 patches/0001-linux6.12.74-reflex-v0.4.0.patch (latency_weight=300)"  # re-checked 2026-11-01: still upstream HEAD
BALANCE_UPSTREAM="itel-rs4-kernel patches/rs4/rs4_balance.c (v7)"
ADIOS_UPSTREAM="firelzrd/adios@6fa79e3 patches/stable/0001-linux6.12.44-ADIOS-3.3.0.patch"
KCOMPRESSD_UPSTREAM="firelzrd/kcompressd-unofficial@3a42168 patches/stable/0001-linux6.12.44-kcompressd-unofficial-0.5.patch"
